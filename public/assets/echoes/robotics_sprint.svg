<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3B35"/>
      <stop offset="100%" stop-color="#23211D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cyberSage)"/>

  <!-- PCB Circuit Grid lines -->
  <path d="M 50 150 L 250 150 L 300 200 L 500 200 L 550 250 L 750 250" fill="none" stroke="#2B6E63" stroke-width="3"/>
  <path d="M 100 450 L 300 450 L 350 400 L 600 400 L 650 350 L 750 350" fill="none" stroke="#2B6E63" stroke-width="3"/>
  <circle cx="250" cy="150" r="6" fill="#E29D38"/>
  <circle cx="500" cy="200" r="6" fill="#FBF8EE"/>
  <circle cx="350" cy="400" r="6" fill="#E29D38"/>

  <!-- Autonomous Rover Chassis -->
  <rect x="280" y="260" width="240" height="150" rx="16" fill="#23211D" stroke="#2B6E63" stroke-width="6"/>
  <!-- Wheels -->
  <rect x="240" y="270" width="40" height="60" rx="8" fill="#555" stroke="#FBF8EE" stroke-width="2"/>
  <rect x="240" y="340" width="40" height="60" rx="8" fill="#555" stroke="#FBF8EE" stroke-width="2"/>
  <rect x="520" y="270" width="40" height="60" rx="8" fill="#555" stroke="#FBF8EE" stroke-width="2"/>
  <rect x="520" y="340" width="40" height="60" rx="8" fill="#555" stroke="#FBF8EE" stroke-width="2"/>

  <!-- Sensor Turret & LiDAR -->
  <circle cx="400" cy="335" r="35" fill="#2B6E63" stroke="#FBF8EE" stroke-width="3"/>
  <circle cx="400" cy="335" r="14" fill="#C85A32"/>
  <line x1="400" y1="300" x2="400" y2="240" stroke="#E29D38" stroke-width="4"/>
  <polygon points="390,240 410,240 400,225" fill="#E29D38"/>

  <!-- Title Badge -->
  <rect x="40" y="480" width="350" height="68" rx="6" fill="#FBF8EE" stroke="#23211D" stroke-width="3"/>
  <text x="60" y="508" fill="#23211D" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2">AUTONOMOUS ROVER SPRINT</text>
  <text x="60" y="532" fill="#2B6E63" font-family="'Playfair Display', Georgia, serif" font-size="15" font-style="italic">Robotics &amp; Hardware Arena Live Sprints</text>
</svg>

