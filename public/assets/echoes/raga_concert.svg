<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#E29D38" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#C85A32" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#23211D" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#23211D"/>
  <rect width="800" height="600" fill="url(#stageGlow)"/>
  
  <!-- Wooden Stage Floor -->
  <polygon points="100,550 700,550 620,440 180,440" fill="#3D2619" stroke="#E29D38" stroke-width="2"/>
  
  <!-- Musical Instrument Sitar Silhouettes -->
  <path d="M 330 460 Q 300 440 310 400 Q 330 380 370 390 Q 390 430 360 460 Z" fill="#E29D38" stroke="#23211D" stroke-width="3"/>
  <line x1="340" y1="390" x2="260" y2="230" stroke="#FBF8EE" stroke-width="8" stroke-linecap="round"/>
  <circle cx="260" cy="230" r="16" fill="#C85A32" stroke="#FBF8EE" stroke-width="2"/>

  <!-- Tabla Set -->
  <ellipse cx="450" cy="450" rx="35" ry="22" fill="#5A3E2A" stroke="#23211D" stroke-width="3"/>
  <ellipse cx="450" cy="445" rx="20" ry="12" fill="#23211D"/>
  <ellipse cx="510" cy="445" rx="30" ry="20" fill="#8C887B" stroke="#23211D" stroke-width="3"/>
  <ellipse cx="510" cy="442" rx="16" ry="10" fill="#23211D"/>

  <!-- Festoon Fairy Lights overhead -->
  <path d="M 0 80 Q 200 160 400 90 Q 600 170 800 80" fill="none" stroke="#E29D38" stroke-width="2"/>
  <circle cx="100" cy="115" r="7" fill="#FBF8EE"/>
  <circle cx="220" cy="138" r="8" fill="#E29D38"/>
  <circle cx="340" cy="108" r="7" fill="#FBF8EE"/>
  <circle cx="480" cy="120" r="8" fill="#E29D38"/>
  <circle cx="620" cy="138" r="7" fill="#FBF8EE"/>
  <circle cx="720" cy="105" r="8" fill="#E29D38"/>

  <!-- Title Badge -->
  <rect x="40" y="480" width="340" height="70" rx="6" fill="#FBF8EE" stroke="#23211D" stroke-width="3"/>
  <text x="60" y="510" fill="#23211D" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2">DUSK RAGA SESSION</text>
  <text x="60" y="534" fill="#C85A32" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic">Banyan Amphitheatre · Live Acoustic</text>
